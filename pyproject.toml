[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lead-radar"
version = "0.1.0"
description = "Find local home-service businesses with the SerpApi Google Maps API and score which ones most need automation help."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["serpapi", "google-maps", "lead-generation", "local-business"]
dependencies = [
    "serpapi>=1.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36", "pandas>=2.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
lead-radar = "lead_radar.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PTH", "S"]
ignore = [
    "S101", # asserts are fine in tests and for narrowing
    "S311", # random is used for retry jitter and fixtures, never for secrets
    "RUF001", # review text and opening hours legitimately contain typographic characters
]

[tool.ruff.lint.per-file-ignores]
"src/lead_radar/cli.py" = ["B008"] # typer.Option(...) defaults are the Typer idiom
"tests/*" = ["S105", "S106"]
"scripts/*" = ["S105"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["serpapi", "serpapi.*", "streamlit", "streamlit.*", "pandas"]
ignore_missing_imports = true
follow_imports = "skip"
